version: 2.1

anchors:
  context: &context
    context: shared

  default_job_config: &default_job_config
    working_directory: /home/circleci/plugin
    machine:
      image: default

  test_job_config: &test_job_config
    <<: *context
    requires:
      - prepare

jobs:
  # Single source of truth for checkout / dependency install / E2E env setup.
  # Persists the working directory so test and release jobs attach instead of
  # re-installing.
  prepare:
    <<: *default_job_config
    steps:
      - checkout
      - run:
          name: Fetch tags
          command: git fetch --tags
      - run:
          name: Create .npmrc
          command: |
            echo "//npm.pkg.github.com/:_authToken=${GH_AUTH_TOKEN}" >> ~/.npmrc
            echo "@gravitykit:registry=https://npm.pkg.github.com" >> ~/.npmrc
      - restore_cache:
          keys:
            - deps-{{ .Branch }}-{{ checksum "package-lock.json" }}-{{ checksum "composer.lock" }}
      - run:
          name: Install dependencies
          command: |
            npx @gravitykit/gktools npm install
            npx @gravitykit/gktools composer install
      - run:
          name: Lint
          command: |
            npm run lint
            npx @gravitykit/gktools composer code:analyze
            npx @gravitykit/gktools composer code:sniff
      - run:
          # The plugin enqueues dist/js/gf-zero-spam.js and
          # dist/js/gf-zero-spam-admin.js at runtime; without them the
          # token-injection async filter never registers (real-user submits
          # land as spam) and the email-rejection rule-builder UI never
          # renders. Build the assets before E2E or 6 tests fail with
          # 404-on-script-load symptoms.
          name: Build front-end assets
          command: npm run build
      - run:
          # Only fetch the GF zip here; .env (which carries the license key) is
          # generated in run_e2e_tests so the secret never lands in the
          # persisted workspace.
          name: Download Gravity Forms
          command: |
            npx @gravitykit/gktools gh release download -R gravityforms/gravityforms --clobber --pattern "*.zip" --dir .tmp
            unzip .tmp/gravityforms*.zip -d .tmp
      - save_cache:
          key: deps-{{ .Branch }}-{{ checksum "package-lock.json" }}-{{ checksum "composer.lock" }}
          paths:
            - /home/circleci/plugin/node_modules
            - /home/circleci/plugin/vendor
            - /home/circleci/plugin/vendor_prefixed
      - persist_to_workspace:
          root: /home/circleci
          paths:
            - .

  # Brings up wp-env (with retries — Docker pulls and DB init occasionally
  # flake on first start) and runs the Playwright suite. The suite is
  # configured workers:1 in playwright.config.js because tests mutate one
  # shared WordPress option; xlarge resource still finishes the suite well
  # under the job's wallclock budget.
  run_e2e_tests:
    <<: *default_job_config
    parallelism: 1
    resource_class: xlarge
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          # Build .env at runtime from the CircleCI context so the
          # GRAVITY_FORMS_LICENSE_KEY value is never written into the
          # persisted workspace and never interpolated into a shell command
          # string. awk reads the secret out of the process environment.
          name: Render .env
          command: |
            cp .env.sample .env
            awk -v val="${PWD}/.tmp/gravityforms" \
                'sub(/^WP_ENV_PLUGINS=.*/, "WP_ENV_PLUGINS=" val) {print; next} 1' \
                .env > .env.tmp && mv .env.tmp .env
            awk -v val="${GRAVITYFORMS_KEY}" \
                'sub(/^GRAVITY_FORMS_LICENSE_KEY=.*/, "GRAVITY_FORMS_LICENSE_KEY=" val) {print; next} 1' \
                .env > .env.tmp && mv .env.tmp .env
      - run:
          name: Run E2E tests
          command: |
            attempt=0
            max_attempts=3
            sleep_time=5
            while [ $attempt -lt $max_attempts ]; do
              npm run tests:e2e:setup && break
              attempt=$(( attempt + 1 ))
              rm -rf /home/circleci/.wp-env
              echo "Retrying WP-ENV setup in $sleep_time seconds… (attempt $attempt/$max_attempts)"
              sleep $sleep_time
            done
            if [ $attempt -eq $max_attempts ]; then
              echo "WP-ENV setup failed."
              exit 1
            fi
            npm run tests:e2e:run
      - store_artifacts:
          path: tests/E2E/results
      - store_artifacts:
          path: tests/E2E/report
      - store_test_results:
          path: tests/E2E/results

  build_package_release:
    <<: *default_job_config
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Verify version consistency
          command: |
            if [ "${CIRCLE_BRANCH}" == "main" ]; then
              npx @gravitykit/gktools verify
            else
              echo "Skipping version verification (only runs on main)."
            fi
      - run:
          name: Configure git
          command: |
            git config user.email "support@gravitykit.com"
            git config user.name "GravityKit - CI"
      - run:
          name: Replace @since tags
          command: |
            if [ "${CIRCLE_BRANCH}" == "main" ]; then
              npx @gravitykit/gktools replace-since --commit
            else
              echo "Skipping @since tag replacement (only runs on main, before release build)."
            fi
      - run:
          name: Build and package
          command: npx @gravitykit/gktools build
      - run:
          name: Sign build
          command: npx @gravitykit/gktools sign
      - run:
          name: Trigger translation pipeline
          command: |
            if [ "${CIRCLE_BRANCH}" == "develop" ] || [ "${CIRCLE_BRANCH}" == "main" ]; then
              npx @gravitykit/gktools translate gravity-forms-zero-spam --commit --push
            else
              echo "Skipping translation pipeline."
            fi
      - run:
          name: Create GitHub release
          command: npx @gravitykit/gktools release
      - run:
          name: Announce build
          command: |
            if ! git log -1 --pretty=%B | grep -iq "\[skip notify\]"; then
              npx @gravitykit/gktools announce
            fi
      - run:
          name: Collect build artifacts
          command: |
            mkdir -p .release
            cp gravity-forms-zero-spam-*.zip .release/ 2>/dev/null || true
      - store_artifacts:
          path: .release
          destination: release

workflows:
  version: 2
  test_build_and_release:
    jobs:
      - prepare:
          <<: *context
      - run_e2e_tests:
          <<: *test_job_config
      - build_package_release:
          <<: *context
          requires:
            - run_e2e_tests
