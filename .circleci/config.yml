version: 2.1

anchors:
  context: &context
    context: shared

  default_job_config: &default_job_config
    working_directory: /home/circleci/plugin
    machine:
      image: ubuntu-2604:current

  test_job_config: &test_job_config
    <<: *context
    requires:
      - prepare

  # Ends the job successfully unless this build is on a release branch (main,
  # main-beta) or a PR targeting one. run_post_build_smoke tests the packaged
  # zip, so the release PR is when it matters.
  #
  # Under git flow a release arrives as a PR from the matching development
  # branch, so CIRCLE_BRANCH reads "develop" for both a release PR and an
  # ordinary develop push. Only the base separates them and CircleCI exposes
  # no variable for it, so this asks GitHub.
  #
  # A failed lookup runs the job: wrongly skipping ships an unsmoked zip.
  release_branches_only: &release_branches_only
    run:
      name: Skip unless on a release branch or a PR into one
      command: |
        is_release_branch() {
          case "$1" in
            main|main-beta) return 0 ;;
            *) return 1 ;;
          esac
        }
        if is_release_branch "${CIRCLE_BRANCH}"; then
          echo "On release branch ${CIRCLE_BRANCH} — running."
          exit 0
        fi
        if [ -z "${CIRCLE_PULL_REQUEST}" ]; then
          echo "Not a PR — skipping."
          circleci-agent step halt
          exit 0
        fi
        pr_number="${CIRCLE_PULL_REQUEST##*/}"
        base=$(curl -sf \
          -H "Authorization: Bearer ${GH_AUTH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls/${pr_number}" \
          | python3 -c 'import sys, json; print(json.load(sys.stdin)["base"]["ref"])') || base=""
        if [ -z "${base}" ]; then
          echo "Could not read the base branch of PR #${pr_number} — running rather than risk an unsmoked release."
          exit 0
        fi
        if is_release_branch "${base}"; then
          echo "PR #${pr_number} targets ${base} — running."
          exit 0
        fi
        echo "PR #${pr_number} targets ${base}, not a release branch — skipping."
        circleci-agent step halt

commands:
  configure_git:
    steps:
      - run:
          name: Configure git
          command: |
            git config user.email "support@gravitykit.com"
            git config user.name "GravityKit - CI"

  build_zip:
    steps:
      - configure_git
      - run:
          name: Replace @since tags
          command: |
            if [ "${CIRCLE_BRANCH}" == "main" ]; then
              npx @gravitykit/gktools replace-since --commit
            else
              echo "Skipping @since tag replacement (only runs on main, before release build)."
            fi
      - run:
          name: Build and package
          command: npx @gravitykit/gktools build
      # Fail loudly if the build produced no .zip: silently swallowing
      # the cp error would let an empty release slip through to
      # run_post_build_smoke (which would then "pass" with nothing to
      # exercise).
      - run:
          name: Collect build artifacts
          command: |
            mkdir -p .release .build-out
            cp gravity-forms-zero-spam-*.zip .release/
            # The build regenerates translations.pot (grunt makepot). The
            # publish step hands it to the translation pipeline.
            cp translations.pot .build-out/
            # The publish job runs translate and release against this tree: the
            # replace-since commit on main and the tracked files the build changed,
            # which `gktools release` commits. Ignored dependency folders stay out.
            mkdir -p .build-out
            tar -czf /tmp/build-tree.tgz \
              --exclude=./node_modules --exclude=./vendor --exclude=./vendor_prefixed \
              --exclude=./.tmp --exclude=./.release --exclude=./.build-out .
            mv /tmp/build-tree.tgz .build-out/

  # Runs only after E2E and the post-build smoke pass, because it pushes
  # translations and creates the GitHub release.
  publish_zip:
    steps:
      - run:
          name: Trigger translation pipeline
          command: |
            if [ "${CIRCLE_BRANCH}" == "develop" ] || [ "${CIRCLE_BRANCH}" == "main" ]; then
              npx @gravitykit/gktools translate gravity-forms-zero-spam --commit --push
            else
              echo "Skipping translation pipeline."
            fi
      - run:
          name: Create GitHub release
          command: npx @gravitykit/gktools release
      - run:
          name: Announce build
          command: |
            if ! git log -1 --pretty=%B | grep -iq "\[skip notify\]"; then
              npx @gravitykit/gktools announce
            fi

  # node_modules is kept out of the workspace, so only the test jobs that run
  # node pay to download it. They restore the exact cache `prepare` saved; if
  # that cache is missing (another pipeline held the key and its upload was
  # skipped), this installs instead.
  restore_node_modules:
    steps:
      # Never on main or main-beta: caches are shared by every branch, so a
      # release pipeline installs from scratch rather than run code a branch saved.
      - when:
          condition:
            not:
              matches:
                pattern: "^main(-beta)?$"
                value: << pipeline.git.branch >>
          steps:
            - restore_cache:
                keys:
                  - npm-v1-{{ checksum "/home/circleci/.ci-deps/npm.want" }}
      - run:
          name: Install npm dependencies if the cache missed
          command: |
            if [ -d node_modules ]; then
              echo "node_modules restored from cache."
              exit 0
            fi
            npx @gravitykit/gktools npm install

  # Build and publish jobs start from their own checkout, never from the
  # prepare workspace. On a branch, prepare runs tools from a shared cache, so
  # anything they wrote into the plugin folder could otherwise ship in the zip
  # or ride along in a translations commit. Only the built zip and
  # translations.pot cross over, copied by name.
  clean_checkout:
    steps:
      - checkout
      - run:
          name: Fetch tags and configure npm
          command: |
            git fetch --tags
            echo "//npm.pkg.github.com/:_authToken=${GH_AUTH_TOKEN}" >> ~/.npmrc
            echo "@gravitykit:registry=https://npm.pkg.github.com" >> ~/.npmrc
            echo "audit=false" >> ~/.npmrc
            echo "fund=false" >> ~/.npmrc
            echo "update-notifier=false" >> ~/.npmrc

  install_build_deps_fresh:
    steps:
      - run:
          name: Install the build's dependencies from scratch
          # Every branch publishes a build. Caches are shared by every branch,
          # so the zip is never built from one: a cache an unreviewed branch
          # saved under the same key could otherwise ship.
          command: |
            rm -rf node_modules vendor
            npx @gravitykit/gktools composer install
            npx @gravitykit/gktools npm install

jobs:
  # Single source of truth for checkout / dependency install / E2E env setup.
  # Persists the working directory so test and release jobs attach instead of
  # re-installing.
  prepare:
    parameters:
      # false on main and main-beta: their vendor and node_modules are
      # installed from scratch, never from a cache a branch could have written.
      restore_dep_caches:
        type: boolean
        default: true
    <<: *default_job_config
    steps:
      - checkout
      - run:
          name: Fetch tags
          command: git fetch --tags
      - run:
          name: Create .npmrc
          # npm's audit runs on every install and nothing here reads it.
          command: |
            echo "//npm.pkg.github.com/:_authToken=${GH_AUTH_TOKEN}" >> ~/.npmrc
            echo "@gravitykit:registry=https://npm.pkg.github.com" >> ~/.npmrc
            echo "audit=false" >> ~/.npmrc
            echo "fund=false" >> ~/.npmrc
            echo "update-notifier=false" >> ~/.npmrc
      # One hash per tool, over everything that decides what its install
      # produces. The cache keys and the skip check in "Install dependencies"
      # both read these files, so they cannot disagree. The month is in the
      # hash because gktools installs inside a Docker image whose tag can move,
      # so each cache is rebuilt at least once a month.
      - run:
          name: Hash dependency inputs
          command: |
            mkdir -p ~/.ci-deps
            { cat package-lock.json package.json; date -u +%Y-%m; } | sha256sum > ~/.ci-deps/npm.want
            { cat composer.lock composer.json; date -u +%Y-%m; } | sha256sum > ~/.ci-deps/composer.want
      # Keyed on the lockfiles, not the branch: two branches with the same
      # lockfile need the same install. The bare prefix restores the newest
      # cache when a lockfile changed, so the install only applies the change.
      - when:
          condition: << parameters.restore_dep_caches >>
          steps:
            # Never on main or main-beta: caches are shared by every branch, so a
            # release pipeline installs from scratch rather than run code a branch saved.
            - when:
                condition:
                  not:
                    matches:
                      pattern: "^main(-beta)?$"
                      value: << pipeline.git.branch >>
                steps:
                  - restore_cache:
                      keys:
                        - npm-v1-{{ checksum "/home/circleci/.ci-deps/npm.want" }}
                        - npm-v1-
            # Never on main or main-beta: caches are shared by every branch, so a
            # release pipeline installs from scratch rather than run code a branch saved.
            - when:
                condition:
                  not:
                    matches:
                      pattern: "^main(-beta)?$"
                      value: << pipeline.git.branch >>
                steps:
                  - restore_cache:
                      keys:
                        - composer-v1-{{ checksum "/home/circleci/.ci-deps/composer.want" }}
                        - composer-v1-
      - run:
          name: Install dependencies
          # A restored cache whose `.have` matches `.want` was built from these
          # exact inputs, so its install is skipped. The Composer autoloader is
          # still rebuilt: its classmap lists this branch's classes, and the
          # cache may come from another branch.
          command: |
            if cmp -s ~/.ci-deps/npm.want ~/.ci-deps/npm.have; then
              echo "node_modules was built from this package-lock.json; skipping npm install."
            else
              npx @gravitykit/gktools npm install
              cp ~/.ci-deps/npm.want ~/.ci-deps/npm.have
            fi

            if cmp -s ~/.ci-deps/composer.want ~/.ci-deps/composer.have; then
              echo "vendor was built from this composer.lock; rebuilding the autoloader only."
              npx @gravitykit/gktools composer dump-autoload -o
            else
              npx @gravitykit/gktools composer install
              cp ~/.ci-deps/composer.want ~/.ci-deps/composer.have
            fi
      - run:
          # A Stable tag lagging the plugin header ships nothing to wp.org.
          name: Verify release version consistency
          command: npx @gravitykit/gktools verify
      - run:
          name: Lint
          command: |
            npm run lint
            npx @gravitykit/gktools composer code:analyze
            npx @gravitykit/gktools composer code:sniff
      - run:
          # The plugin enqueues dist/js/gf-zero-spam.js and
          # dist/js/gf-zero-spam-admin.js at runtime; without them the
          # token-injection async filter never registers (real-user submits
          # land as spam) and the email-rejection rule-builder UI never
          # renders. Build the assets before E2E or 6 tests fail with
          # 404-on-script-load symptoms.
          name: Build front-end assets
          command: npm run build
      - run:
          # Fetch GF and render .env. The .env file must be in the persisted
          # workspace so the downstream run_post_build_smoke job (which
          # attaches the workspace from the build job) can boot wp-env
          # against the built .zip artifact. The license key is sourced from
          # the CircleCI context and written via sed so it never appears on
          # any command line.
          name: Configure E2E environment
          command: |
            npx @gravitykit/gktools gh release download -R gravityforms/gravityforms --clobber --pattern "*.zip" --dir .tmp
            unzip .tmp/gravityforms*.zip -d .tmp
            cp .env.sample .env
            sed -i "s|WP_ENV_PLUGINS=.*|WP_ENV_PLUGINS=${PWD}/.tmp/gravityforms|" .env
            sed -i "s|GRAVITY_FORMS_LICENSE_KEY=.*|GRAVITY_FORMS_LICENSE_KEY=${GRAVITYFORMS_KEY}|" .env
      - save_cache:
          key: npm-v1-{{ checksum "/home/circleci/.ci-deps/npm.want" }}
          paths:
            - /home/circleci/plugin/node_modules
            - /home/circleci/.ci-deps/npm.have
      - save_cache:
          key: composer-v1-{{ checksum "/home/circleci/.ci-deps/composer.want" }}
          paths:
            - /home/circleci/plugin/vendor
            - /home/circleci/.ci-deps/composer.have
      # The jobs that need node_modules restore the npm cache saved above.
      - run:
          name: Leave node_modules out of the workspace
          command: rm -rf node_modules
      # Only what later jobs use. Composer's download cache and auth file stay
      # behind; gktools hands Docker its credentials as environment variables.
      - persist_to_workspace:
          root: /home/circleci
          paths:
            - plugin
            - .npmrc
            - .ssh
            - .npm/_npx
            - .ci-deps/npm.want

  # Brings up wp-env (with retries: Docker pulls and DB init occasionally
  # flake on first start) and runs the Playwright suite. The suite is
  # configured workers:1 in playwright.config.js because tests mutate one
  # shared WordPress option; xlarge resource still finishes the suite well
  # under the job's wallclock budget.
  run_e2e_tests:
    <<: *default_job_config
    parallelism: 1
    resource_class: medium.gen3
    steps:
      - attach_workspace:
          at: /home/circleci
      - restore_node_modules
      - run:
          name: Run E2E tests
          command: |
            attempt=0
            max_attempts=3
            sleep_time=5
            while [ $attempt -lt $max_attempts ]; do
              npm run tests:e2e:setup && break
              attempt=$(( attempt + 1 ))
              rm -rf /home/circleci/.wp-env
              echo "Retrying WP-ENV setup in $sleep_time seconds… (attempt $attempt/$max_attempts)"
              sleep $sleep_time
            done
            if [ $attempt -eq $max_attempts ]; then
              echo "WP-ENV setup failed."
              exit 1
            fi
            npm run tests:e2e:run
      - store_artifacts:
          path: tests/E2E/results
      - store_artifacts:
          path: tests/E2E/report
      - store_test_results:
          path: tests/E2E/results

  # Builds the zip. Off main and main-beta it runs beside the tests, because
  # nothing in the build reads their results; publish_release waits for E2E
  # before anything leaves CI.
  build_package:
    <<: *default_job_config
    steps:
      - clean_checkout
      - install_build_deps_fresh
      - build_zip
      - persist_to_workspace:
          root: /home/circleci
          paths:
            - plugin/.release
            - plugin/.build-out
      - store_artifacts:
          path: .release
          destination: release

  # main and main-beta: replace-since commits before the build, so the build
  # waits for the tests there.
  build_package_release:
    <<: *default_job_config
    steps:
      - clean_checkout
      - install_build_deps_fresh
      - build_zip
      - persist_to_workspace:
          root: /home/circleci
          paths:
            - plugin/.release
            - plugin/.build-out
      - store_artifacts:
          path: .release
          destination: release

  # Boots wp-env against the *built* .zip artifact and runs the @smoke-tagged
  # subset of the Playwright suite (currently activation.spec.js). This is the
  # last gate before release: it catches packaging defects that the source-tree
  # E2E suite cannot see (missing dist/ files, autoloader misses, dev-only
  # dependencies that didn't get bundled, etc.). The bootstrap CLI handles
  # unzipping, dev-dep restore via the gktools Docker composer (PHP 7.4), and
  # wp-env boot with retry; see @gravitykit/e2e-bootstrap README.
  run_post_build_smoke:
    <<: *default_job_config
    machine:
      image: ubuntu-2604:current
    resource_class: medium.gen3
    steps:
      - *release_branches_only
      - attach_workspace:
          at: /home/circleci
      - restore_node_modules
      - run:
          name: Post-build smoke
          command: |
            npx @gravitykit/e2e-bootstrap smoke \
              --composer-cmd "npx @gravitykit/gktools composer install"
      - store_artifacts:
          path: tests/E2E/results
      - store_artifacts:
          path: tests/E2E/report
      - store_test_results:
          path: tests/E2E/results/junit.xml

  # Publishes the GitHub release and announces the build only AFTER the
  # post-build smoke gate passes, so a packaging defect can never ship.
  # `gktools release` greps the cwd (not .release/) for the zip.
  publish_release:
    <<: *default_job_config
    steps:
      - clean_checkout
      - attach_workspace:
          at: /tmp/workspace
      # The tree comes from the build job, which also started from a clean
      # checkout, so nothing prepare wrote reaches it.
      - run:
          name: Restore the build's tree and zip
          command: |
            tar -xzf /tmp/workspace/plugin/.build-out/build-tree.tgz
            cp /tmp/workspace/plugin/.release/gravity-forms-zero-spam-*.zip .
      - configure_git
      - publish_zip

workflows:
  version: 2
  # Every branch except main and main-beta. The zip builds beside E2E;
  # nothing is published until E2E and the post-build smoke pass.
  test_build_and_release:
    when:
      not:
        matches:
          pattern: "^main(-beta)?$"
          value: << pipeline.git.branch >>
    jobs:
      - prepare:
          <<: *context
      - run_e2e_tests:
          <<: *test_job_config
      - build_package:
          <<: *context
          requires:
            - prepare
      - run_post_build_smoke:
          <<: *context
          requires:
            - build_package
      - publish_release:
          <<: *context
          requires:
            - run_e2e_tests
            - run_post_build_smoke

  # main and main-beta publish releases. E2E gates the build.
  # Keep the test jobs in step with test_build_and_release above.
  release:
    when:
      matches:
        pattern: "^main(-beta)?$"
        value: << pipeline.git.branch >>
    jobs:
      - prepare:
          <<: *context
          restore_dep_caches: false
      - run_e2e_tests:
          <<: *test_job_config
      - build_package_release:
          <<: *context
          requires:
            - run_e2e_tests
      - run_post_build_smoke:
          <<: *context
          requires:
            - build_package_release
      - publish_release:
          <<: *context
          requires:
            - run_post_build_smoke
